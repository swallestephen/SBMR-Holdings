<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAMMA BUILDERS | Project Gallery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/*=============================
        GLOBAL
==============================*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#ffffff;
}

/*=============================
      GALLERY SECTION
==============================*/

.gallery-section{
    width:100%;
    padding:80px 8%;
    background:#ffffff;
}

.section-title{
    text-align:center;
    margin-bottom:60px;
}

.section-title h2{
    font-size:42px;
    color:#0b5d1e;
    margin-bottom:15px;
    font-weight:700;
}

.section-title p{
    max-width:750px;
    margin:auto;
    color:#555;
    line-height:1.8;
    font-size:17px;
}

/*=============================
        GALLERY GRID
==============================*/

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

/*=============================
        IMAGE CARD
==============================*/

.gallery-item{
    position:relative;
    overflow:hidden;
    border-radius:15px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    transition:.4s;
    background:#000;
}

.gallery-item img{
    width:100%;
    height:260px;
    object-fit:cover;
    display:block;
    transition:.6s;
}

/*=============================
      HOVER OVERLAY
==============================*/

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;


    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    opacity:0;
    transition:.4s;

    color:#fff;
    text-align:center;
}

.overlay h3{
    font-size:22px;
    margin-bottom:10px;
}

.overlay p{
    font-size:15px;
    padding:0 20px;
}

.gallery-item:hover .overlay{
    opacity:1;
}

.gallery-item:hover img{
    transform:scale(1.15);
}

.gallery-item:hover{
    transform:translateY(-8px);
}

/*=============================
        LIGHTBOX
==============================*/

.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.lightbox img{
    width:90%;
    max-width:900px;
    max-height:90vh;
    border-radius:10px;
}

.lightbox span{
    position:absolute;
    top:20px;
    right:35px;
    font-size:45px;
    color:#fff;
    cursor:pointer;
}

/*=============================
        RESPONSIVE
==============================*/

@media(max-width:768px){

.section-title h2{
    font-size:32px;
}

.gallery-item img{
    height:220px;
}

}

@media(max-width:500px){

.gallery{
    grid-template-columns:1fr;
}

.gallery-item img{
    height:240px;
}

}

</style>

</head>
<body>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">

<span onclick="closeImage()">&times;</span>

<img id="lightbox-img">

</div>

<script>

function openImage(src){

document.getElementById("lightbox").style.display="flex";

document.getElementById("lightbox-img").src=src;

}

function closeImage(){

document.getElementById("lightbox").style.display="none";

}

document.getElementById("lightbox").addEventListener("click",function(e){

if(e.target===this){

closeImage();

}

});

</script>
